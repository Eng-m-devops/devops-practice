name: CD Pipeline (Continuous Deployment)

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    name: Deploy Application via Ansible
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Ansible Core & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible requests

      - name: Setup SSH Key for Server Access
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Execute Ansible Deployment Playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_SSH_COMMON_ARGS: "-o StrictHostKeyChecking=no -o PubkeyAcceptedKeyTypes=+ssh-rsa -o HostKeyAlgorithms=+ssh-rsa"
          TARGET_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          
          # Create dynamic inventory override if SERVER_HOST secret is set
          if [ -n "${{ secrets.SERVER_HOST }}" ]; then
            mkdir -p inventory
            echo "[webservers]" > inventory/hosts.ini
            echo "app-node-01 ansible_host=${{ secrets.SERVER_HOST }} ansible_user=${{ secrets.SERVER_USER || 'ubuntu' }}" >> inventory/hosts.ini
          fi
          
          ansible-playbook playbooks/site.yml
        working-directory: ./ansible

      - name: Verify Deployment Health Endpoint
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          if [ -n "$SERVER_HOST" ]; then
            echo "Performing live Health Check on deployed API..."
            curl --fail --retry 5 --retry-delay 3 http://${SERVER_HOST}:5000/api/status || exit 1
            echo "Deployment Health Check Passed Successfully!"
          else
            echo "No SERVER_HOST secret provided, skipping remote live health check."
          fi
