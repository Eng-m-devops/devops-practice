name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # 1. فحص البنية التحتية (Terraform IaC)
  infrastructure-ci:
    name: Infrastructure Validation (Terraform)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Check Terraform Formatting
        run: terraform fmt -check
        working-directory: ./terraform

      - name: Initialize Terraform
        run: terraform init -backend=false
        working-directory: ./terraform

      - name: Validate Terraform Code
        run: terraform validate
        working-directory: ./terraform

  # 2. فحص سكريبتات الأتمتة (Ansible Syntax Check)
  ansible-ci:
    name: Ansible Playbooks Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Ansible
        run: pip install ansible-core

      - name: Validate Ansible Playbook Syntax
        run: ansible-playbook playbooks/site.yml --syntax-check
        working-directory: ./ansible

  # 3. تحليل الكود الساكن والجودة (SonarQube)
  code-analysis:
    name: Code Quality & Security (SonarQube)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4.5.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run SonarQube Analysis
        uses: SonarSource/sonarqube-scan-action@v3.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # 4. بناء واختبار الباك إند وفحص الحاوية (Backend CI)
  backend-ci:
    name: Backend Build & Security Scan
    needs: [infrastructure-ci, ansible-ci, code-analysis]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.7.1

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3.3.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Image
        uses: docker/build-push-action@v5.4.0
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'

  # 5. بناء واختبار الفرونت إند (Frontend CI)
  frontend-ci:
    name: Frontend Build
    needs: [infrastructure-ci, ansible-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.7.1

      - name: Build Frontend Image
        uses: docker/build-push-action@v5.4.0
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
