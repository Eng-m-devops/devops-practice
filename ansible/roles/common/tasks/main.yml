---
- name: Update apt cache & upgrade packages
  apt:
    update_cache: yes
    cache_valid_time: 3600
    upgrade: dist
  when: ansible_os_family == "Debian"

- name: Install baseline system packages
  apt:
    name:
      - curl
      - wget
      - git
      - htop
      - ufw
      - ca-certificates
      - gnupg
      - lsb-release
      - unzip
      - python3-pip
      - python3-setuptools
      - net-tools
    state: present

- name: Set system timezone file to UTC
  copy:
    content: "UTC\n"
    dest: /etc/timezone
    mode: '0644'

- name: Set system timezone symlink to UTC
  file:
    src: /usr/share/zoneinfo/UTC
    dest: /etc/localtime
    state: link
    force: yes

- name: Ensure required deployment directories exist
  file:
    path: "{{ deploy_dir }}"
    state: directory
    mode: '0755'
