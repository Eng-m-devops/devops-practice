---
- name: Update apt cache & upgrade packages
  apt:
    update_cache: yes
    cache_valid_time: 3600
    upgrade: dist
  when: ansible_os_family == "Debian"

- name: Install baseline system packages
  apt:
    name:
      - curl
      - wget
      - git
      - htop
      - ufw
      - ca-certificates
      - gnupg
      - lsb-release
      - unzip
      - python3-pip
      - python3-setuptools
      - net-tools
    state: present

- name: Set system timezone to UTC
  timezone:
    name: UTC

- name: Ensure required deployment directories exist
  file:
    path: "{{ deploy_dir }}"
    state: directory
    mode: '0755'
