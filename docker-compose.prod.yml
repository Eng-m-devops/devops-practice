services:
  database:
    image: postgres:15-alpine
    container_name: container-postgresdb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-myapp}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: container-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  backend:
    build: ./backend
    container_name: container-backend
    env_file:
      - ./backend/.env
    environment:
      - PGHOST=database
      - REDIS_HOST=redis
    expose:
      - "5000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --spider http://localhost:5000/api/status || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: always
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: container-frontend
    ports:
      - "80:80"
    healthcheck:
      test:
        ["CMD-SHELL", "wget --quiet --spider http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
